# Jon Harrison's lead: force GRTC to use its private LFLPRC oscillator
# instead of the shared system LFCLK, so it never asserts reqLfclkBuff
# and (per his sim) allows HVBUCK to reach LP_ULV. Standard, already-
# supported Zephyr/nrfx Kconfig choice -- no custom code.
CONFIG_NRF_GRTC_TIMER_SOURCE_LFLPRC=y
