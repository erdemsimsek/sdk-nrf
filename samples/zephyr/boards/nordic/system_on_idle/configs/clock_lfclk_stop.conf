# Jon Harrison's follow-up: explicitly stop the shared system LFCLK after
# switching GRTC to LFLPRC, to test whether something else keeps it
# running (and blocking ELV) independent of GRTC's own clock selection.
# Combine with configs/grtc_source_lflprc.conf. Unbounded wait loop --
# see the Kconfig help for the hang risk.
CONFIG_NRF7120_CLOCK_LFCLK_STOP=y
