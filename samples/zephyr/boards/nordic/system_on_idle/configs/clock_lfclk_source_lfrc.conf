# Jon Harrison's lead: switch the shared system LFCLK source to LFRC
# (stop, reconfigure, restart -- left running, not stopped) to test
# whether ELV is then entered automatically, without needing
# configs/clock_lfclk_stop.conf's "stop and leave it off" workaround.
# Unbounded wait loops on both stop and restart -- see the Kconfig help.
CONFIG_NRF7120_CLOCK_LFCLK_SOURCE_LFRC=y
